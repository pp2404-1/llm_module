version: '3.8'

services:
  llm-service:
    build: .
    container_name: pollflow-llm-service
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - MODEL_NAME=mixtral:8x7b
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - pollflow-network
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Include Ollama if you want to run everything in Docker
  # This is a placeholder - adjust based on Ollama's Docker setup
  ollama:
    image: ollama/ollama:latest
    container_name: pollflow-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - pollflow-network

networks:
  pollflow-network:
    driver: bridge

volumes:
  ollama-data:

